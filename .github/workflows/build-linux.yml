name: build-linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mode: [embedded, server]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri (${{ matrix.mode }})
        run: npx tauri build --bundles deb,rpm,appimage -- --features ${{ matrix.mode }}-mode

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: achieve-music-linux-${{ matrix.mode }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
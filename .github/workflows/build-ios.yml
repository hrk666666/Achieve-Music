name: build-ios

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    # NOTE: A device installable .ipa / TestFlight distribution additionally
    # requires an Apple Developer Program account + signing certificate +
    # provisioning profile (set APPLE_DEVELOPMENT_TEAM). This workflow produces
    # an unsigned iOS app build so the pipeline is validated.
    env:
      CODE_SIGNING_ALLOWED: 'NO'
      APPLE_DEVELOPMENT_TEAM: ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Frontend
        run: npm run build

      - name: Init iOS project
        run: npx tauri ios init

      - name: Build iOS (unsiged, embedded-mode)
        run: npx tauri ios build --target aarch64-apple-ios-sim -- --features embedded-mode

      - name: Collect build output
        run: |
          mkdir -p ios-dist
          find src-tauri -type d -name '*.app' -maxdepth 12 2>/dev/null | head
          find src-tauri -type f -name '*.app' -prune -o -type d -name '*.app' -print | head
          find src-tauri -name '*.ipa' -exec cp {} ios-dist/ \; 2>/dev/null || true

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: achieve-music-ios
          path: |
            ios-dist/
            src-tauri/gen/apple/**/build/**/*.app
            src-tauri/gen/apple/**/build/**/*.ipa
            src-tauri/gen/apple/**/build/**/*.ipas
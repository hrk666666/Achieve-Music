name: build-windows

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [embedded, server]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri (${{ matrix.mode }})
        run: npx tauri build -- --features ${{ matrix.mode }}-mode

      - name: 打包绿色版(免安装便携版)
        shell: pwsh
        run: |
          $green = "AchieveMusic-green-${{ matrix.mode }}"
          New-Item -ItemType Directory -Force -Path $green | Out-Null
          Copy-Item src-tauri/target/release/achieve-music.exe "$green/AchieveMusic.exe" -Force
          Copy-Item -Recurse -Force dist "$green/dist"
          Compress-Archive -Path $green -DestinationPath "$green.zip" -Force
          Get-ChildItem *.zip

      - name: Upload green (portable) artifact
        uses: actions/upload-artifact@v4
        with:
          name: achieve-music-green-${{ matrix.mode }}
          path: AchieveMusic-green-${{ matrix.mode }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: achieve-music-${{ matrix.mode }}
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: 上传 GitHub Release 发行版
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Achieve Music ${{ github.ref_name }}
          generate_release_notes: true
          append_body: true
          overwrite_files: true
          files: |
            AchieveMusic-green-${{ matrix.mode }}.zip
            src-tauri/target/release/bundle/nsis/*.exe
